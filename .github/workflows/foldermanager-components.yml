          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '${{ env.TF_VERSION }}' }
      - run: terraform init
      - run: terraform validate
      - id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.plan.outcome == 'success'
        run: terraform apply -auto-approve tfplan

  webapp:
    name: '7️⃣ Web App'
    needs: [storageaccount, docintelligence, openai, aisearch]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    environment: production
    defaults: { run: { working-directory: ./foldermanager/webapp } }
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '${{ env.TF_VERSION }}' }
      - run: terraform init
      - run: terraform validate
      - id: plan
